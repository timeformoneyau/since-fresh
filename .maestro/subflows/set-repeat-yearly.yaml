# On the Add screen, with the keyboard closed: repeat every 1 year
# (once-off items have no Done button)
appId: com.since.app
---
- scrollUntilVisible:
    element:
      id: "add-repeat-input"
- tapOn:
    id: "add-repeat-input"
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "add-unit-years"
- tapOn:
    id: "add-unit-years"
