# From the empty list: add one once-off item named ${NAME}.
appId: com.since.app
---
- tapOn:
    id: "empty-add-button"
- tapOn:
    id: "add-name-input"
- inputText: ${NAME}
# Not a keyboard test (Save with the keyboard open has its own flow)
- hideKeyboard
# Some names (e.g. Passport) start on "Until it's due"; this adds a once-off record
- tapOn:
    id: "add-track-since"
# Below "How do you want to track it?"
- scrollUntilVisible:
    element:
      id: "add-onceoff-option"
- tapOn:
    id: "add-onceoff-option"
- scrollUntilVisible:
    element:
      id: "add-save-button"
- tapOn:
    id: "add-save-button"
- extendedWaitUntil:
    visible:
      id: "item-${NAME}"
    timeout: 10000
