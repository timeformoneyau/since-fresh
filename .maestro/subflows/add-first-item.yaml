# From the empty list: add one once-off item named ${NAME}.
appId: com.since.app
---
- tapOn:
    id: "empty-add-button"
- tapOn:
    id: "add-name-input"
- inputText: ${NAME}
# Not a keyboard test (Save with the keyboard open has its own flow)
- hideKeyboard
- tapOn:
    id: "add-onceoff-option"
- scrollUntilVisible:
    element:
      id: "add-save-button"
- tapOn:
    id: "add-save-button"
- extendedWaitUntil:
    visible:
      id: "item-${NAME}"
    timeout: 10000
