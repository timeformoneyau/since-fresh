appId: com.since.app
name: Add an item with a repeat cycle
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: "empty-add-button"
- tapOn:
    id: "add-name-input"
- inputText: "Water plants"
# This flow is about the repeat, not the keyboard (07 covers Save with it open)
- hideKeyboard
# Repeats is the default, every 30 days; one more makes it 31
- scrollUntilVisible:
    element:
      id: "add-stepper-plus"
- tapOn:
    id: "add-stepper-plus"
- assertVisible:
    id: "add-repeat-value"
    text: "31"
- scrollUntilVisible:
    element:
      id: "add-save-button"
- tapOn:
    id: "add-save-button"
- extendedWaitUntil:
    visible:
      id: "item-Water plants"
    timeout: 10000
- assertVisible: ".*in 31 days.*"
- takeScreenshot: 02-add-with-repeat
