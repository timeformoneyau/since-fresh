appId: com.since.app
name: Settings screen opens from the list, with reminder time, Export and Restore
# Test builds are local-only, so this is the no-account Settings screen. The
# share sheet and file picker belong to Android, not the app, so the flow
# stops at the buttons; component tests cover what they do.
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: "main-account-button"
- assertVisible: "Settings"
- assertVisible:
    id: "reminder-time-0900"
- tapOn:
    id: "reminder-time-1800"
- extendedWaitUntil:
    visible: "Reminders will come at 6 pm"
    timeout: 10000
- assertVisible:
    id: "account-export-button"
- assertVisible:
    id: "account-restore-button"
- takeScreenshot: 11-settings-screen
- assertNotVisible:
    id: "account-sign-in-button"
