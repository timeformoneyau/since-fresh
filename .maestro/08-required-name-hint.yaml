appId: com.since.app
name: Save with no name shows the required-field hint
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: "empty-add-button"
- assertVisible: "Repeat every \\(optional\\)"
# With no name, Save reports itself as disabled to accessibility (it can't
# save yet) while staying tappable to show the hint
- tapOn:
    id: "add-save-button"
    enabled: false
- assertVisible: "Add a name to save"
- takeScreenshot: 08-required-name-hint
# Typing a name clears the hint
- tapOn:
    id: "add-name-input"
- inputText: "Dentist"
- assertNotVisible:
    id: "add-save-hint"
