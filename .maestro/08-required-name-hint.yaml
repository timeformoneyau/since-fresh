appId: com.since.app
name: Save with no name shows the required-field hint
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: "empty-add-button"
- assertVisible: "Does it repeat\\?"
# The name field takes focus on open; close the keyboard so Save shows
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "add-save-button"
- tapOn:
    id: "add-save-button"
# The hint sits just below Save, so it can be off the bottom edge when Save
# was scrolled only just into view. Bring it into view rather than assuming
# it already is; this still fails if the hint never appears.
- scrollUntilVisible:
    element:
      id: "add-save-hint"
- assertVisible: "Add a name to save"
- takeScreenshot: 08-required-name-hint
# Typing a name clears the hint
- scrollUntilVisible:
    direction: UP
    element:
      id: "add-name-input"
- tapOn:
    id: "add-name-input"
- inputText: "Dentist"
- assertNotVisible:
    id: "add-save-hint"
