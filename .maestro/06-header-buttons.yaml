appId: com.since.app
name: Main list header ＋ is tappable (not under the status bar)
# Maestro can't measure positions, so this checks the effect: if the header
# sat under the status bar, Android would take the tap and Add wouldn't open.
# (In local-only test builds the person button opens the backup screen; flow 11.)
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/add-first-item.yaml
    env:
      NAME: Milk
- takeScreenshot: 06-header
- tapOn:
    id: "main-add-button"
- assertVisible:
    id: "add-name-input"
