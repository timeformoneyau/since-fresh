appId: com.since.app
name: Delete an item (swipe left, Delete), then Undo
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/add-first-item.yaml
    env:
      NAME: Passport
- runFlow:
    file: subflows/open-swipe-actions.yaml
    env:
      NAME: Passport
- tapOn:
    id: "item-Passport-delete"
- assertVisible: "Passport deleted"
- takeScreenshot: 05-delete-toast
- tapOn:
    id: "toast-action"
- extendedWaitUntil:
    visible:
      id: "item-Passport"
    timeout: 10000
