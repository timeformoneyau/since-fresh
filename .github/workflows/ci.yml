name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the run that's still going
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check (tsc)
        run: npx tsc --noEmit
      - name: Domain tests (npm test)
        run: npm test
      - name: Component tests (npm run test:ui)
        run: npm run test:ui -- --ci

  # Stored data, sync or sign-in code can't change without a test beside it
  # (CLAUDE.md, rule 8). Release refuses to publish a PR without this green.
  data-safety:
    name: Data safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the check itself
        run: bash .github/scripts/data-safety.test.sh
      - name: Check data, sync and sign-in changes have tests
        run: |
          status=0
          bash .github/scripts/data-safety.sh \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || status=$?
          cat data-safety.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  android-flows:
    name: Android flows (Maestro)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Test build runs local-only: no Supabase, no sign-in (see app.config.js)
      SINCE_LOCAL_ONLY: '1'
      CI: '1'
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: |
          npx expo prebuild --platform android --no-install
          # The default 512 MB metaspace runs out once expo-updates is in (the
          # build then hangs); the runner has 16 GB
          sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvmargs=/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Build test APK (x86_64 only, for the emulator)
        working-directory: android
        # About 7 minutes with a warm cache; fail fast rather than hang
        timeout-minutes: 40
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache emulator image
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel_6-4c4g

      - name: Create emulator snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created"

      - name: Run Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-maestro.sh

      - name: Upload Maestro screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-results/
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 14
