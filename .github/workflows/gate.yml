name: Release gate

# Information only: always passes, no labels needed. It reports whether the PR
# touches stored data, sync, sign-in or notifications. (Kept, under the same
# name, so a branch rule that still lists "Release gate" doesn't block PRs.)
# The real data rule is the "Data safety" check in ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report sensitive areas (never fails)
        run: |
          bash .github/scripts/data-safety.sh \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true
          echo "Releases are automatic: this check never blocks a merge."
          cat data-safety.md >> "$GITHUB_STEP_SUMMARY"
