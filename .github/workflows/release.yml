name: Release

# Runs after every merge to main:
#   1. tsc + domain + component tests again (never publish on red)
#   2. preview  - always, automatically
#   3. production - automatically for AUTOMATIC changes; for GATED changes it
#      waits for the owner to approve the "production-gated" deployment
# Each step publishes an EAS Update, or starts an EAS build when the change is
# native (see .github/scripts/release.sh), and comments on the merged PR.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: read   # to read the production-gated environment's reviewers

jobs:
  checks:
    name: Checks before release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:ui -- --ci

  classify:
    name: Classify the merged change
    runs-on: ubuntu-latest
    outputs:
      gated: ${{ steps.c.outputs.gated }}
      pr: ${{ steps.c.outputs.pr }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}')
          PR=$(echo "$PR_JSON" | jq -r '.number // empty')
          LABELS=$(echo "$PR_JSON" | jq -c '[.labels[]?.name]')
          # Only an explicit "automatic" (and no "gated") skips the human gate
          if echo "$LABELS" | jq -e 'index("automatic") != null and index("gated") == null' > /dev/null; then
            GATED=false
          else
            GATED=true
          fi
          echo "PR #${PR:-none}, labels $LABELS -> gated=$GATED"
          echo "gated=$GATED" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

  preview:
    name: Publish to preview
    needs: [checks, classify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is missing. See RELEASING.md, 'One-time setup'."; exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: Publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash .github/scripts/release.sh preview
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.classify.outputs.pr }}
          GATED: ${{ needs.classify.outputs.gated }}
        run: |
          [ -f release-summary.md ] || echo "### ❌ preview: publishing failed. See the Release run log." > release-summary.md
          if [ "$GATED" = "true" ]; then
            printf '\n**GATED change:** production waits for your OK. Try it in *Since (preview)*, then open the Release run and click **Review deployments → Approve**.\n' >> release-summary.md
          fi
          cat release-summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -z "$PR" ] || gh pr comment "$PR" --repo "${{ github.repository }}" --body-file release-summary.md

  production:
    name: Publish to production
    needs: [preview, classify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GATED changes wait here for the owner's approval (required reviewer on
    # the production-gated environment). AUTOMATIC changes go straight through.
    environment: ${{ needs.classify.outputs.gated == 'true' && 'production-gated' || 'production' }}
    steps:
      - name: Refuse if the production gate has no reviewer
        if: needs.classify.outputs.gated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/environments/production-gated" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' || echo 0)
          if [ "$N" -lt 1 ]; then
            echo "::error::The production-gated environment has no required reviewer, so nothing would stop a GATED change. Set it up (RELEASING.md, 'One-time setup'), then re-run this job."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash .github/scripts/release.sh production
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.classify.outputs.pr }}
        run: |
          [ -f release-summary.md ] || echo "### ❌ production: publishing failed. See the Release run log." > release-summary.md
          cat release-summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -z "$PR" ] || gh pr comment "$PR" --repo "${{ github.repository }}" --body-file release-summary.md
