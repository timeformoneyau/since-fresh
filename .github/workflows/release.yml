name: Release

# Runs after every merge to main, fully automatically (no approvals):
#   1. the merged PR's checks must all have passed (CI, Android flows, Data
#      safety), and tsc + domain + component tests run again: never publish on red
#   2. preview
#   3. production, once preview has published
# Each step publishes an EAS Update, or starts an EAS build when the change is
# native (see .github/scripts/release.sh), and comments on the merged PR.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: read   # to confirm the merged PR's checks passed

jobs:
  checks:
    name: Checks before release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:ui -- --ci

  verify:
    name: Confirm the merged PR passed every check
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.v.outputs.pr }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub links a merged commit to its PR a few seconds after the
          # merge, so a lookup straight away can come back empty. Ask again.
          for attempt in 1 2 3 4 5 6; do
            PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}')
            PR=$(echo "$PR_JSON" | jq -r '.number // empty')
            HEAD=$(echo "$PR_JSON" | jq -r '.head.sha // empty')
            [ -n "$PR" ] && break
            echo "No pull request linked to this commit yet (try $attempt of 6)"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          if [ -z "$PR" ]; then
            echo "::error::This commit didn't come from a pull request, so its checks never ran. Nothing is published."; exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # Latest result of each check on the PR's last commit
          RUNS=$(gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs?per_page=100" \
            --jq '[.check_runs[] | {name, conclusion, at: (.completed_at // .started_at)}] | sort_by(.at) | reverse')
          failed=0
          for check in "Type check and tests" "Android flows (Maestro)" "Data safety"; do
            result=$(echo "$RUNS" | jq -r --arg n "$check" '[.[] | select(.name == $n)][0].conclusion // "missing"')
            echo "PR #$PR, $check: $result"
            [ "$result" = success ] || { echo "::error::'$check' did not pass on PR #$PR ($result). Nothing is published."; failed=1; }
          done
          exit $failed

  preview:
    name: Publish to preview
    needs: [checks, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is missing. See RELEASING.md, 'One-time setup'."; exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: Publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash .github/scripts/release.sh preview
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.verify.outputs.pr }}
        run: |
          [ -f release-summary.md ] || echo "### ❌ preview: publishing failed, so production was not touched. See the Release run log." > release-summary.md
          cat release-summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -z "$PR" ] || gh pr comment "$PR" --repo "${{ github.repository }}" --body-file release-summary.md

  production:
    name: Publish to production
    # Runs only once preview has published; no approval step
    needs: [preview, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash .github/scripts/release.sh production
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.verify.outputs.pr }}
        run: |
          [ -f release-summary.md ] || echo "### ❌ production: publishing failed. See the Release run log." > release-summary.md
          cat release-summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -z "$PR" ] || gh pr comment "$PR" --repo "${{ github.repository }}" --body-file release-summary.md
